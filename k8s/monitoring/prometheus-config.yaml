apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: default

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: processor
        static_configs:
          - targets:
              - processor-service:8000

      - job_name: api
        static_configs:
          - targets:
              - api-service:8080