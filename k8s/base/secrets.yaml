# ==============================================================================
# AI-Powered Observability Platform - Kubernetes Secrets Templates
# ==============================================================================
# WARNING: NEVER commit real base64-encoded credentials to public git repositories.
# Use this template for reference, or deploy using the CLI instructions below.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: aws-secret
  namespace: default
type: Opaque
data:
  # Base64 encoded AWS access credentials (e.g. echo -n 'my_value' | base64)
  AWS_ACCESS_KEY_ID: dGVtcGxhdGVfYWNjZXNzX2tleV9pZA==
  AWS_SECRET_ACCESS_KEY: dGVtcGxhdGVfc2VjcmV0X2FjY2Vzc19rZXk=
---
apiVersion: v1
kind: Secret
metadata:
  name: groq-secret
  namespace: default
type: Opaque
data:
  # Base64 encoded Groq API Key
  GROQ_API_KEY: dGVtcGxhdGVfZ3JvcV9hcGlfa2V5X2hlcmU=

# ==============================================================================
# 🚀 RECOMMENDED: SECURE DYNAMIC CLI CREATION (NO MANIFEST FILES)
# Run these commands directly on your administrative machine to inject secrets
# without storing base64 strings in any file:
# ==============================================================================
#
# 1. Create the AWS Secret:
#    kubectl create secret generic aws-secret \
#      --from-literal=AWS_ACCESS_KEY_ID="your_real_aws_access_key" \
#      --from-literal=AWS_SECRET_ACCESS_KEY="your_real_aws_secret_key"
#
# 2. Create the Groq Secret:
#    kubectl create secret generic groq-secret \
#      --from-literal=GROQ_API_KEY="your_real_gsk_groq_api_key"
#
# ==============================================================================
