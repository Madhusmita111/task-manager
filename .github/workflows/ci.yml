name: CI Pipeline (Test & Build)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI!

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests fastapi uvicorn groq prometheus_client

      - name: Run Unit Tests
        run: |
          PYTHONPATH=./app/api pytest app/api/test_api.py

      - name: Build API Docker Image
        run: |
          docker build -t task-manager-api ./app/api

      - name: Build Producer Docker Image
        run: |
          docker build -t task-manager-producer ./app/producer

      - name: Build Processor Docker Image
        run: |
          docker build -t task-manager-processor ./app/processor
